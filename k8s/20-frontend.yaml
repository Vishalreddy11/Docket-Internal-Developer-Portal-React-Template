apiVersion: v1
kind: Service
metadata:
  name: docket-frontend
  namespace: docket-frontend
spec:
  type: ClusterIP
  selector:
    app: docket-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docket-frontend
  namespace: docket-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docket-frontend
  template:
    metadata:
      labels:
        app: docket-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: docket-frontend
          image: docket-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
          volumeMounts:
            - name: runtime-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: docket-frontend-runtime-config
