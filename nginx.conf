# Nginx config for serving the Docket React SPA.
#
# Ships:
#   - Gzip for text assets
#   - SPA fallback (unknown paths -> index.html)
#   - CSP + security headers baked in
#   - Runtime config served at /config/runtime-config.json (mounted from a
#     ConfigMap in K8s so each environment can override without a rebuild)
#
# Listens on :8080 so nothing needs root privileges.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'req_id="$http_x_request_id"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # Runtime-writable directories (nginx needs these; without them a
    # non-root worker can't run because it can't write temp files).
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/xml+rss text/xml image/svg+xml;
    gzip_vary on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # ==== Security headers ====
        # Content-Security-Policy is the biggest hardening lever. Tighten
        # the connect-src / img-src / style-src for your specific backend
        # + IdP before shipping. This default is safe for the MSW dev demo.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://identity.your-company.example; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Hashed asset bundles: long cache, immutable.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Runtime config — mounted from a K8s ConfigMap at /config.
        location /config/ {
            add_header Cache-Control "no-store" always;
            alias /config/;
        }

        # SPA fallback — unknown paths return index.html so client-side
        # routing (TanStack Router) can take over.
        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }

        # Health check for K8s.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }
    }
}
